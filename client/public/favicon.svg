<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" class="w-full h-full">
  <defs>
    <linearGradient id="shieldBorder" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
    <linearGradient id="shieldFill" x1="32" y1="4" x2="32" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.08" />
    </linearGradient>
    <linearGradient id="nodeCore" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10B981" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Hexagonal Shield Background Body -->
  <path
    d="M32 5 L55 16 V34 C55 47 45 56 32 60 C19 56 9 47 9 34 V16 Z"
    fill="url(#shieldFill)"
  />

  <!-- Bold Outer Hexagonal Shield Outline -->
  <path
    d="M32 5 L55 16 V34 C55 47 45 56 32 60 C19 56 9 47 9 34 V16 Z"
    stroke="url(#shieldBorder)"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#neonGlow)"
  />

  <!-- Thick Lattice Connecting Pathways -->
  <path
    d="M32 20 L21 33 M32 20 L43 33 M21 33 L32 46 M43 33 L32 46 M21 33 L43 33"
    stroke="url(#shieldBorder)"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Leader & Workforce Nodes -->
  <circle cx="32" cy="20" r="4.5" fill="url(#nodeCore)" stroke="#FFFFFF" stroke-width="1.5" />
  <circle cx="21" cy="33" r="4" fill="url(#nodeCore)" stroke="#FFFFFF" stroke-width="1.5" />
  <circle cx="43" cy="33" r="4" fill="url(#nodeCore)" stroke="#FFFFFF" stroke-width="1.5" />
  <circle cx="32" cy="46" r="3.5" fill="url(#nodeCore)" stroke="#FFFFFF" stroke-width="1.5" />
</svg>